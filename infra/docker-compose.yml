services:
  graphdb:
    image: ontotext/graphdb:11.5.2
    ports: [ "7200:7200" ]
    environment:
      GDB_HEAP_SIZE: 2g
      # GraphDB 11 requires a license even for the Free edition (see infra/graphdb/license/)
      GDB_JAVA_OPTS: -Dgraphdb.license.file=/opt/graphdb/license/graphdb.license
    volumes:
      - graphdb-data:/opt/graphdb/home
      - ./graphdb/license:/opt/graphdb/license:ro
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:7200/rest/info/version" ]
      interval: 5s
      timeout: 3s
      retries: 30

  # One-shot: creates the acme repository and loads the fixtures if it doesn't exist yet
  graphdb-init:
    image: curlimages/curl:8.11.1
    entrypoint: [ "sh", "/graphdb/init.sh" ]
    environment:
      GRAPHDB_URL: http://graphdb:7200
      FIXTURES_DIR: /fixtures
    volumes:
      - ./graphdb:/graphdb:ro
      - ../packages/backend/fixtures:/fixtures:ro
    depends_on:
      graphdb:
        condition: service_healthy
    restart: "no"
  # fuseki:
  #   image: stain/jena-fuseki
  #   profiles: ["fuseki"]
  #   environment:
  #     - FUSEKI_DATASET=acme
  #   ports: ["3030:3030"]
  #   volumes:
  #     - ./fuseki/ds:/fuseki-base/databases/acme

  typesense:
    image: typesense/typesense:0.25.2
    command: ["--data-dir", "/data", "--api-key", "${TYPESENSE_API_KEY:-xyz}"]
    ports: [ "8108:8108" ]
    volumes: [ "typesense-data:/data" ]

  redis:
    image: redis:7-alpine
    ports: [ "6379:6379" ]

  backend:
    build:
      context: ..
      dockerfile: packages/backend/Dockerfile
    env_file: .env
    environment:
      # GRAPHDB_ENDPOINT: ${GRAPHDB_ENDPOINT:-http://graphdb:7200/repositories/acme}
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on: [ typesense, redis ]
    ports: [ "4000:4000" ]

  frontend:
    build:
      context: ..
      dockerfile: packages/frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:4000
    depends_on: [ backend ]
    ports: [ "3000:3000" ]

volumes:
  graphdb-data:
  typesense-data: