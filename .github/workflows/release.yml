name: release

# Publishes a release when a version tag is pushed:
#
#   ghcr.io/<owner>/ontology-workbench-backend:<version>
#   ghcr.io/<owner>/ontology-workbench-frontend:<version>
#
# Both images are multi-arch (linux/amd64, linux/arm64), signed with cosign
# keyless (GitHub OIDC), and carry SBOM and build-provenance attestations in the
# registry. A GitHub Release collects the SBOMs and scan reports.
#
# scripts/security-scan.sh is the gate, and it runs before anything is pushed:
# the source passes first, then every platform image is built, loaded and
# scanned locally. Only when all of them pass is the multi-arch image pushed —
# from the same build cache, so the published layers are the scanned ones. A
# version tag never exists in the registry for an artifact that failed.
#
# Tags: v1.2.3 publishes 1.2.3, 1.2 and latest. A pre-release (v1.2.3-rc.1)
# publishes only its exact version and is marked as a pre-release.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/ontology-workbench
  TRIVY_VERSION: v0.76.1
  GITLEAKS_VERSION: 8.30.1

jobs:
  gate-source:
    name: Gate — dependencies and credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The credential pass scans reachable history, not just this commit.
          fetch-depth: 0

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Dependency gate
        run: scripts/security-scan.sh deps

      - name: Credential scan (reported, non-blocking)
        run: scripts/security-scan.sh secrets

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-source
          path: .security/reports/
          if-no-files-found: ignore

  images:
    name: Image — ${{ matrix.component }}
    needs: gate-source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to ghcr.io
      id-token: write       # cosign keyless + attestations (Sigstore OIDC)
      attestations: write   # GitHub artifact attestations
    strategy:
      fail-fast: true
      matrix:
        component: [backend, frontend]
    env:
      IMAGE: ${{ format('ghcr.io/{0}/ontology-workbench-{1}', github.repository_owner, matrix.component) }}
      DOCKERFILE: packages/${{ matrix.component }}/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=ontology-workbench-${{ matrix.component }}

      # --- build and scan each platform before anything is pushed -------------
      # `load` accepts one platform at a time, so each is built separately into
      # the local daemon and scanned there. The cache scopes are reused by the
      # multi-arch push below.
      - name: Build linux/amd64 for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64
          load: true
          provenance: false
          sbom: false
          tags: ow-${{ matrix.component }}-amd64:scan
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}-amd64
          cache-to: type=gha,scope=${{ matrix.component }}-amd64,mode=max

      - name: Build linux/arm64 for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/arm64
          load: true
          provenance: false
          sbom: false
          tags: ow-${{ matrix.component }}-arm64:scan
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}-arm64
          cache-to: type=gha,scope=${{ matrix.component }}-arm64,mode=max

      - name: Image gate
        run: >-
          scripts/security-scan.sh image
          ow-${{ matrix.component }}-amd64:scan
          ow-${{ matrix.component }}-arm64:scan

      # --- publish --------------------------------------------------------------
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BuildKit's own provenance/SBOM are off: they add `unknown/unknown`
      # entries to the image index that some registry proxies and older Podman
      # versions mishandle. Attestations are attached by the steps below
      # instead, as OCI referrers that leave the index clean.
      - id: push
        name: Push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: |
            type=gha,scope=${{ matrix.component }}-amd64
            type=gha,scope=${{ matrix.component }}-arm64

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign with cosign (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: ontology-workbench-${{ matrix.component }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ontology-workbench-${{ matrix.component }}.spdx.json
          push-to-registry: true

      - name: Record published digest
        run: |
          printf '%s@%s\n' "$IMAGE" "${{ steps.push.outputs.digest }}" > "image-${{ matrix.component }}.txt"
          {
            echo "### ${{ matrix.component }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "${IMAGE}@${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-${{ matrix.component }}
          path: |
            .security/reports/
            ontology-workbench-${{ matrix.component }}.spdx.json
            image-${{ matrix.component }}.txt
          if-no-files-found: ignore

  github-release:
    name: GitHub Release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Assemble release assets
        run: |
          set -euo pipefail
          mkdir -p assets
          cp artifacts/reports-*/ontology-workbench-*.spdx.json assets/
          cat artifacts/reports-*/image-*.txt > assets/images.txt
          # One archive of every scan report, source and image passes alike.
          tar -czf assets/security-reports.tar.gz -C artifacts .

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          {
            echo "## Images"
            echo
            echo '```'
            cat assets/images.txt
            echo '```'
            echo
            echo "Verify a signature:"
            echo
            echo '```bash'
            echo "cosign verify ${IMAGE_PREFIX}-backend:${TAG#v} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } > notes.md
          gh release create "$TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file notes.md \
            --generate-notes \
            "${prerelease[@]}"
