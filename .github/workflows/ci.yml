name: ci
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install
      - name: Unit tests
        run: pnpm test:unit
      - name: E2E (backend, optional Fuseki)
        if: ${{ false }} # flip to true when e2e added
        run: |
          cd infra && docker compose --profile fuseki up -d
          pnpm test:e2e
